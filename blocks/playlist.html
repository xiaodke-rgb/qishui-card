<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: var(--oc-fg, #111);
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
        font-size: 13px;
      }
      #root {
        padding: 0;
      }

      /* 去掉安卓点击时盖在按钮上的蓝色方块高亮和焦点框 */
      button {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
        outline: none;
        font-family: inherit;
      }
      button:focus:not(:focus-visible) {
        outline: none;
      }

      .card {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border-radius: calc(var(--oc-rem, 1rem) * 0.75);
        color: #fff;
      }
      .veil {
        position: absolute;
        inset: -24%;
        z-index: -2;
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        filter: blur(24px) saturate(1.6) brightness(0.58);
        transform: scale(1.12);
      }
      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.05));
        border: 1px solid rgba(255, 255, 255, 0.22);
        pointer-events: none;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
      }
      .cover {
        width: 52px;
        height: 52px;
        flex: 0 0 52px;
        border-radius: 50%;
        object-fit: cover;
        background: rgba(255, 255, 255, 0.18);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.34);
      }
      .meta {
        flex: 1 1 auto;
        min-width: 0;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
        color: #fff;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .artist {
        margin-top: 2px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.82);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bar {
        position: relative;
        margin-top: 8px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.26);
        cursor: pointer;
        touch-action: none;
      }
      /* 条形只有 3px，上下各扩 9px 做手指命中区。 */
      .bar::before {
        content: '';
        position: absolute;
        left: -2px;
        right: -2px;
        top: -9px;
        bottom: -9px;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.94);
        transition: width 0.2s linear;
      }
      .play {
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        display: grid;
        place-items: center;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        transition: background 0.15s ease, transform 0.15s ease;
      }
      .play:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .play:active {
        transform: scale(0.94);
      }
      .play svg {
        width: 16px;
        height: 16px;
      }
      .play.busy {
        opacity: 0.55;
        pointer-events: none;
      }

      /* 展开条：和卡片同一块，位于底部 */
      .allrow {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 0 14px 12px;
        border: 0;
        background: none;
        color: rgba(255, 255, 255, 0.86);
        font-size: 12px;
        cursor: pointer;
        text-align: left;
      }
      .allrow .dot {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      .allrow .dot svg {
        width: 9px;
        height: 9px;
      }
      .allrow .chev {
        margin-left: auto;
        transition: transform 0.2s ease;
      }
      .allrow .chev svg {
        width: 12px;
        height: 12px;
      }
      .card.open .allrow .chev {
        transform: rotate(180deg);
      }

      .list {
        display: none;
        padding: 0 6px 6px;
        /* 展开后最多显示 5 首，多出来的上下滑动，避免歌单一长卡片就变很高。 */
        max-height: 232px;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.35) transparent;
      }
      .list::-webkit-scrollbar {
        width: 4px;
      }
      .list::-webkit-scrollbar-thumb {
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.35);
      }
      .list::-webkit-scrollbar-track {
        background: transparent;
      }
      .card.open .list {
        display: block;
      }
      .divider {
        height: 1px;
        margin: 0 8px 4px;
        background: rgba(255, 255, 255, 0.18);
      }
      .tr {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 6px 8px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: #fff;
        cursor: pointer;
        text-align: left;
      }
      .tr:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .tr.on {
        background: rgba(255, 255, 255, 0.16);
      }
      .ix {
        width: 18px;
        flex: 0 0 18px;
        text-align: center;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.62);
        font-variant-numeric: tabular-nums;
      }
      .tr.on .ix {
        color: #fff;
      }
      .eq {
        display: inline-flex;
        align-items: flex-end;
        gap: 1.5px;
        height: 10px;
      }
      .eq i {
        width: 2px;
        background: #fff;
        border-radius: 1px;
        animation: bounce 0.9s ease-in-out infinite;
      }
      .eq i:nth-child(1) {
        height: 55%;
        animation-delay: 0s;
      }
      .eq i:nth-child(2) {
        height: 100%;
        animation-delay: 0.25s;
      }
      .eq i:nth-child(3) {
        height: 70%;
        animation-delay: 0.5s;
      }
      .eq.paused i {
        animation-play-state: paused;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: scaleY(0.4);
        }
        50% {
          transform: scaleY(1);
        }
      }
      .tn {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tn small {
        display: block;
        margin-top: 1px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.68);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dur {
        flex: 0 0 auto;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.6);
        font-variant-numeric: tabular-nums;
      }

      .note {
        padding: 12px;
        font-size: 12px;
        color: var(--oc-muted, rgba(127, 127, 127, 0.9));
      }

      .card.plain {
        background: var(--oc-elevated, rgba(127, 127, 127, 0.1));
        color: var(--oc-fg, #111);
      }
      .card.plain .veil {
        display: none;
      }
      .card.plain::after {
        border-color: var(--oc-border, rgba(0, 0, 0, 0.12));
        background: none;
      }
      .card.plain .title,
      .card.plain .tr,
      .card.plain .tn,
      .card.plain .allrow {
        color: var(--oc-fg, #111);
        text-shadow: none;
      }
      .card.plain .artist,
      .card.plain .dur,
      .card.plain .ix,
      .card.plain .tn small {
        color: var(--oc-muted, rgba(127, 127, 127, 0.9));
        text-shadow: none;
      }
      .card.plain .bar {
        background: rgba(127, 127, 127, 0.25);
      }
      .card.plain .bar > i {
        background: var(--oc-primary, #1677ff);
      }
      .card.plain .play {
        border-color: transparent;
        background: var(--oc-primary, #1677ff);
        color: var(--oc-primary-fg, #fff);
      }
      .card.plain .allrow .dot {
        border-color: var(--oc-border, rgba(0, 0, 0, 0.12));
        background-color: transparent;
        color: var(--oc-fg, #111);
      }
      .card.plain .divider {
        background-color: var(--oc-border, rgba(0, 0, 0, 0.12));
      }
      .card.plain .tr:hover,
      .card.plain .tr.on {
        background: rgba(127, 127, 127, 0.12);
      }
      .card.plain .eq i {
        background: var(--oc-primary, #1677ff);
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="note">正在取歌单…</div></div>
    <script src="./playlist.js"></script>
  </body>
</html>
